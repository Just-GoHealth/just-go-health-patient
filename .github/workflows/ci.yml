# CI quality gate (remediation tracker item 12) and production deploy.
#
# - `checks` runs on every push to any branch and on every pull request.
# - `deploy` runs only after `checks` passes on a push to `main` (production) or
#   `staging` (staging URL). It is the only thing that deploys: Vercel's own Git
#   deployments are switched off in vercel.json, so dev and feature branches never deploy.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       Vercel access token with access to the project
#   VERCEL_ORG_ID      "orgId" from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID  "projectId" from .vercel/project.json

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Install @just-gohealth/ui from GitHub Packages with the job's GITHUB_TOKEN.
  packages: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # typedRoutes types live in .next/ (not committed); tsc needs them.
      - name: Generate route types
        run: pnpm exec next typegen

      - name: Lint
        run: pnpm exec eslint .

      - name: Format
        run: pnpm exec prettier --check .

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test (with coverage thresholds)
        run: pnpm exec vitest run --coverage

      - name: Build
        run: pnpm build

  deploy:
    # main → Vercel production (prod backend). staging → a Vercel preview deployment
    # aliased to a stable staging URL (staging backend). Other branches never deploy.
    # Backend URLs and other env vars live in the Vercel project, per environment:
    #   Production: NEXT_PUBLIC_API_BASE_URL=https://justgo.up.railway.app
    #   Preview:    NEXT_PUBLIC_API_BASE_URL=https://jgohealth-backend-staging.up.railway.app
    name: Deploy to Vercel (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # vercel build installs dependencies, including @just-gohealth/ui.
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Stable staging address (repo variable VERCEL_STAGING_ALIAS overrides).
      STAGING_ALIAS: ${{ vars.VERCEL_STAGING_ALIAS || 'justgo-patient-staging.vercel.app' }}
      TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      # Until the Vercel secrets are added, skip (with a warning) instead of
      # failing every push.
      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set - skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        if: steps.secrets.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.secrets.outputs.ready == 'true'
        run: vercel pull --yes --environment="$TARGET" --git-branch="$GITHUB_REF_NAME" --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [ "$TARGET" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [ "$TARGET" = "production" ]; then
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
            vercel alias set "$url" "$STAGING_ALIAS" --token="$VERCEL_TOKEN"
            url="https://$STAGING_ALIAS"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
